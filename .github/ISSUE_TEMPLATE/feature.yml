name: Feature request
description: Propose a bounded Bridger improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or operational gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security / authority impact
      description: Does this add privilege, public exposure, new credentials, or replay/retry behavior?
    validations:
      required: true
